spring.application.name=inventario

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:inventario}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:inventario}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-in-production-please-use-a-long-secret}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Server
server.port=${SERVER_PORT:8080}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}